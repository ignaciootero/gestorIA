packages:
  - "apps/*"
  - "packages/*"

# pnpm no ejecuta scripts de instalacion salvo que se aprueben explicitamente.
# Estos tres los necesitan para bajar su binario nativo.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  lefthook: true

# Catalogo de versiones: cada dependencia compartida se declara una sola vez aca
# y los package.json la referencian con "catalog:". Actualizar una version es
# tocar un solo lugar y evita que dos paquetes usen versiones distintas.
catalog:
  "@hono/node-server": "2.1.1"
  "@types/node": "24.13.5"
  "@types/pg": "8.23.1"
  drizzle-kit: "0.31.10"
  drizzle-orm: "0.45.2"
  hono: "4.13.8"
  pg: "8.23.0"
  pino: "10.3.1"
  pino-pretty: "13.1.3"
  typescript: "7.0.2"
  vitest: "5.0.1"
  zod: "4.6.5"

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.14'
  - '@biomejs/cli-darwin-arm64@2.5.14'
  - '@biomejs/cli-darwin-x64@2.5.14'
  - '@biomejs/cli-linux-arm64-musl@2.5.14'
  - '@biomejs/cli-linux-arm64@2.5.14'
  - '@biomejs/cli-linux-x64-musl@2.5.14'
  - '@biomejs/cli-linux-x64@2.5.14'
  - '@biomejs/cli-win32-arm64@2.5.14'
  - '@biomejs/cli-win32-x64@2.5.14'
